<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دراسة طبية AI + PDF</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Tahoma}
body{background:#0f172a;color:#fff}
header{background:#1e293b;padding:16px;text-align:center;position:sticky;top:0;z-index:10}
header h1{color:#38bdf8;font-size:22px}
.container{max-width:1000px;margin:auto;padding:12px}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:14px;margin:10px 0}
input,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;margin:6px 0}
textarea{min-height:110px}
.btn{background:#38bdf8;color:#0f172a;border:0;padding:11px;border-radius:10px;font-weight:bold;cursor:pointer;width:100%;margin:5px 0}
.btn-green{background:#22c55e;color:#fff}.btn-purple{background:#a855f7;color:#fff}.btn-outline{background:transparent;border:1px solid #38bdf8;color:#38bdf8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subject-card{cursor:pointer}.subject-card:hover{border-color:#38bdf8}
.badge{background:#334155;padding:3px 9px;border-radius:20px;font-size:12px}
.hidden{display:none}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}
.color-btn{width:32px;height:32px;border-radius:50%;border:2px solid #fff;cursor:pointer}
.pdf-view{width:100%;height:500px;border-radius:10px;border:1px solid #334155;background:#fff}
.lecture-content{background:#fff;color:#000;padding:16px;border-radius:10px;line-height:2;min-height:150px;white-space:pre-wrap;outline:none}
.hl-yellow{background:rgba(255,235,59,0.5)}.hl-green{background:rgba(76,175,80,0.4)}.hl-pink{background:rgba(233,30,99,0.3)}.hl-blue{background:rgba(56,189,248,0.35)}
@media(max-width:600px){.grid{grid-template-columns:1fr}.pdf-view{height:380px}}
</style>
</head>
<body>
<header><h1>🩺 دراسة طبية AI</h1><p style="color:#94a3b8;font-size:12px">PDF + تظليل شفاف + تلخيص + أسئلة</p></header>
<div class="container">
<div class="card"><h3>➕ مادة جديدة</h3><input id="subName" placeholder="اسم المادة مثل: فسيولوجي"><input id="subIcon" placeholder="ايموجي 🧠"><button class="btn" onclick="addSubject()">إضافة المادة</button></div>
<div id="subjectsList" class="grid"></div>
<div id="subjectView" class="hidden">
<button class="btn btn-outline" onclick="showHome()">⬅ رجوع للمواد</button>
<div class="card">
<h2 id="curTitle"></h2>
<label style="font-size:13px;color:#94a3b8">📎 ارفع PDF:</label>
<input type="file" id="pdfFile" accept="application/pdf" onchange="loadPDF(event)">
<div id="pdfArea" class="hidden"><iframe id="pdfFrame" class="pdf-view"></iframe></div>
<label style="font-size:13px;color:#94a3b8;margin-top:10px;display:block">📝 نص المحاضرة:</label>
<textarea id="lectureText" placeholder="الصق النص هنا..."></textarea>
<div class="tools">
<span style="font-size:13px">ظلل ثم اختر لون:</span>
<div class="color-btn" style="background:#ffeb3b" onclick="highlight('hl-yellow')"></div>
<div class="color-btn" style="background:#4caf50" onclick="highlight('hl-green')"></div>
<div class="color-btn" style="background:#e91e63" onclick="highlight('hl-pink')"></div>
<div class="color-btn" style="background:#38bdf8" onclick="highlight('hl-blue')"></div>
<button onclick="clearH()" style="background:transparent;color:#94a3b8;border:1px solid #334155;padding:5px 10px;border-radius:20px">مسح</button>
</div>
<div id="editable" class="lecture-content hidden" contenteditable="true"></div>
<div class="grid">
<button class="btn btn-purple" onclick="aiSummarize()">✨ تلخيص AI</button>
<button class="btn btn-green" onclick="aiQuestions()">❓ صنع أسئلة</button>
</div>
<div id="aiOut" class="card hidden" style="background:#0f172a"></div>
<button class="btn" onclick="saveLecture()">💾 حفظ المحاضرة</button>
</div>
<div id="lecturesList"></div>
</div>
</div>
<script>
let subjects=JSON.parse(localStorage.getItem('med_v3')||'[]');
let curId=null, pdfData=null;
if(subjects.length==0){subjects=[{id:1,name:'التشريح',icon:'🦴',lectures:[]}]; save();}
function save(){localStorage.setItem('med_v3',JSON.stringify(subjects)); render();}
function render(){let h='';subjects.forEach(s=>{h+=`<div class="card subject-card" onclick="openSub(${s.id})"><h3>${s.icon} ${s.name}</h3><span class="badge">${s.lectures.length} محاضرة</span></div>`});document.getElementById('subjectsList').innerHTML=h;}
function addSubject(){let n=document.getElementById('subName').value.trim(), ic=document.getElementById('subIcon').value||'📚';if(!n)return alert('اكتب الاسم');subjects.push({id:Date.now(),name:n,icon:ic,lectures:[]});document.getElementById('subName').value='';document.getElementById('subIcon').value='';save();}
function openSub(id){curId=id;document.getElementById('subjectsList').classList.add('hidden');document.getElementById('subjectView').classList.remove('hidden');document.getElementById('curTitle').innerText=subjects.find(x=>x.id==id).icon+' '+subjects.find(x=>x.id==id).name;showLectures();}
function showHome(){document.getElementById('subjectsList').classList.remove('hidden');document.getElementById('subjectView').classList.add('hidden');curId=null;}
function loadPDF(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=function(ev){pdfData=ev.target.result;document.getElementById('pdfArea').classList.remove('hidden');document.getElementById('pdfFrame').src=pdfData;};reader.readAsDataURL(file);}
function highlight(cls){let sel=window.getSelection();if(!sel.rangeCount||sel.toString().trim()=='')return alert('حدد نص أولاً باصبعك');let range=sel.getRangeAt(0);let span=document.createElement('span');span.className=cls;try{range.surroundContents(span);}catch{alert('حدد كلمة واحدة فقط، لا تحدد سطرين');}sel.removeAllRanges();}
function clearH(){let ed=document.getElementById('editable');if(!ed.classList.contains('hidden'))ed.innerHTML=ed.innerText;}
function aiSummarize(){let txt=document.getElementById('lectureText').value||document.getElementById('editable').innerText;if(txt.length<15)return alert('الصق المحاضرة');let sents=txt.split(/[.!؟\n]/).filter(x=>x.trim().length>10).slice(0,5);let sum=sents.map(x=>'• '+x.trim()).join('\n');let out=document.getElementById('aiOut');out.classList.remove('hidden');out.innerHTML='<h3>✨ ملخص</h3><pre style="white-space:pre-wrap;font-family:inherit">'+sum+'</pre>';document.getElementById('editable').classList.remove('hidden');document.getElementById('editable').innerHTML=txt;}
function aiQuestions(){let txt=document.getElementById('lectureText').value||document.getElementById('editable').innerText;if(txt.length<15)return alert('الصق المحاضرة');let sents=txt.split(/[.!؟\n]/).filter(x=>x.trim().length>15).slice(0,4);let qs=sents.map((s,i)=>`<div style="background:#0f172a;padding:10px;border-radius:8px;margin:6px 0;border-right:3px solid #22c55e"><b>س${i+1}: اشرح: ${s.trim().substring(0,45)}...</b><br><small>${s.trim()}</small></div>`).join('');let out=document.getElementById('aiOut');out.classList.remove('hidden');out.innerHTML='<h3>❓ أسئلة</h3>'+qs;}
function saveLecture(){let txt=document.getElementById('lectureText').value.trim();let html=document.getElementById('editable').innerHTML;let sub=subjects.find(x=>x.id==curId);if(!txt&&!pdfData&&!html)return alert('اضف نص او PDF');sub.lectures.push({text:txt,html:html,pdf:pdfData,date:new Date().toLocaleString('ar-YE')});save();showLectures();document.getElementById('lectureText').value='';document.getElementById('editable').innerHTML='';document.getElementById('editable').classList.add('hidden');pdfData=null;alert('تم الحفظ ✅');}
function showLectures(){let sub=subjects.find(x=>x.id==curId);let h='<div class="card"><h3>محاضرات '+sub.name+'</h3></div>';sub.lectures.slice().reverse().forEach(l=>{h+=`<div class="card"><small style="color:#94a3b8">${l.date}</small>${l.pdf?`<br><a href="${l.pdf}" target="_blank" style="color:#38bdf8">📄 فتح PDF</a>`:''}<div style="background:#fff;color:#000;padding:12px;border-radius:8px;margin:8px 0">${l.html||l.text}</div></div>`});document.getElementById('lecturesList').innerHTML=h;}
render();
</script>
</body>
  </html>
